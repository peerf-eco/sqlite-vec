name: publish

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to build"
        required: false
        default: ""
        type: string
      tag:
        description: "Release tag to attach assets to (created if missing, e.g. v0.1.10-alpha.4)"
        required: false
        default: ""
        type: string
      dist_name:
        description: "Wheel distribution name"
        required: false
        default: "sqlite-vec-win-arm64"
        type: string
      publish_pypi:
        description: "Upload the wheel to PyPI"
        required: false
        default: false
        type: boolean
      create_release:
        description: "Attach the wheel to a GitHub Release"
        required: false
        default: true
        type: boolean
      pypi_repository_url:
        description: "PyPI repository URL (leave empty for real PyPI)"
        required: false
        default: ""
        type: string
      cache_ttl_minutes:
        description: "Minutes to retain Actions caches after last access"
        required: false
        default: "60"
        type: string

  # Automatic publishing on tag/release is intentionally disabled. Uncomment to
  # re-enable it, but note that PyPI rejects re-uploading an existing version,
  # so a manual dispatch is the safer default.
  # release:
  #   types: [published]

concurrency:
  group: sqlite-vec-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build win_arm64 wheel
    runs-on: windows-11-arm
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Cache SQLite amalgamation
        id: vendor-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: sqlite-amalgamation-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/vendor.sh') }}

      - name: Fetch SQLite amalgamation
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          chmod +x scripts/vendor.sh
          ./scripts/vendor.sh
          ls -l vendor

      - name: Enable MSVC ARM64 toolchain
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      - name: Set up native ARM64 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: arm64
          cache: ""

      - name: Generate sqlite-vec.h
        run: python scripts/gen-sqlite-vec-h.py

      - name: Compile vec0.dll
        shell: bash
        run: |
          mkdir -p dist
          cl.exe -nologo -W4 -O2 -LD -Ivendor/ sqlite-vec.c -Fe:dist/vec0.dll
          ls -l dist

      - name: Build wheel
        shell: bash
        run: |
          python scripts/build-win-arm64-wheel.py \
            --dll dist/vec0.dll \
            --outdir dist \
            --dist-name "${{ inputs.dist_name }}" \
            --description "Windows ARM64 (win_arm64) build of sqlite-vec, published by peerf-eco."
          ls -l dist

      - name: Verify wheel metadata
        run: |
          python -m pip install --upgrade pip twine
          python -m twine check dist/*.whl

      - name: Smoke test the wheel
        shell: bash
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python - <<'PY'
          import sqlite3
          import sqlite_vec

          db = sqlite3.connect(":memory:")
          sqlite_vec.load(db)
          print("vec_version():", db.execute("select vec_version()").fetchone()[0])

          db.execute("create virtual table v using vec0(embedding float[4])")
          db.execute(
              "insert into v(rowid, embedding) values (1, ?)",
              [sqlite_vec.serialize_float32([0.1, 0.2, 0.3, 0.4])],
          )
          hit = db.execute(
              "select rowid from v where embedding match ? and k = 1",
              [sqlite_vec.serialize_float32([0.1, 0.2, 0.3, 0.4])],
          ).fetchone()
          assert hit[0] == 1, hit

          db.execute("create virtual table i using vec0(embedding int8[4])")
          db.execute(
              "insert into i(rowid, embedding) values (1, vec_int8(?))",
              [sqlite_vec.serialize_int8([1, 2, 3, 4])],
          )
          hamming = db.execute(
              "select distance from i where embedding match vec_int8(?) and k = 1",
              [sqlite_vec.serialize_int8([1, 2, 3, 4])],
          ).fetchone()[0]
          assert hamming == 0.0, hamming

          print("SMOKE TEST OK")
          PY

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-vec-win-arm64-wheel
          path: dist/*.whl
          if-no-files-found: error

  github-release:
    name: Attach wheel to GitHub Release
    needs: build
    if: ${{ inputs.create_release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Download wheel
        uses: actions/download-artifact@v4
        with:
          name: sqlite-vec-win-arm64-wheel
          path: dist

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
          NOTES: >-
            Windows ARM64 (win_arm64) wheel for sqlite-vec.

            Install with `pip install sqlite-vec-win-arm64`.
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          tag="${REQUESTED_TAG:-v${version}}"
          echo "releasing as $tag"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.whl --clobber --repo "$GITHUB_REPOSITORY"
            echo "replaced assets on existing release $tag"
            exit 0
          fi

          prerelease=()
          if echo "$version" | grep -qiE 'alpha|beta|rc'; then
            prerelease=(--prerelease)
          fi

          gh release create "$tag" dist/*.whl \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes "$NOTES" \
            "${prerelease[@]}"
          echo "created release $tag"

  pypi:
    name: Publish to PyPI
    needs: build
    if: ${{ inputs.publish_pypi }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download wheel
        uses: actions/download-artifact@v4
        with:
          name: sqlite-vec-win-arm64-wheel
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: ${{ inputs.pypi_repository_url }}
          # An unset secret leaves this empty, which selects trusted publishing
          # (OIDC). Set PYPI_API_TOKEN to fall back to a scoped API token, which
          # is also what creates the project on the very first upload.
          password: ${{ secrets.PYPI_API_TOKEN }}
          user: __token__
          skip-existing: true
          print-hash: true

  cleanup-cache:
    name: Purge stale caches
    needs: [build, github-release, pypi]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Delete caches older than the retention window
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/purge-actions-cache.py \
            --repo "${{ github.repository }}" \
            --max-age-minutes "${{ inputs.cache_ttl_minutes }}"